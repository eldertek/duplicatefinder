name: Release Notes

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract latest changelog and version
        id: extract_changelog
        run: |
          # Get everything between the first two version headers
          LATEST=$(awk '
            /^## [0-9]+\.[0-9]+\.[0-9]+/ {
              if (count == 0) {
                count = 1
                print
                next
              }
              if (count == 1) {
                exit
              }
            }
            count == 1 { print }
          ' CHANGELOG.md)
          
          # Extract version numbers
          CURRENT_VERSION=$(echo "$LATEST" | head -n1 | grep -oP '## \K[0-9]+\.[0-9]+\.[0-9]+')
          PREVIOUS_VERSION=$(grep -oP '## \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n2 | tail -n1)
          
          # Save to GITHUB_ENV with proper formatting
          {
            echo 'latest<<EOF'
            echo "$LATEST"
            echo 'EOF'
            echo "current_version=$CURRENT_VERSION"
            echo "previous_version=$PREVIOUS_VERSION"
          } >> "$GITHUB_ENV"

      - name: Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Directly assign the environment variable
          BODY="$latest"
          
          # Update release notes
          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            /repos/"${GH_REPO}"/releases/tags/v${current_version} \
            --jq .id \
          | xargs -I {} gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /repos/"${GH_REPO}"/releases/{} \
            -f body="$BODY" 